name: Dual Sniper Mode Update (10:00 KST)

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 01:00 UTC = 10:00 KST, 월~금
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)

permissions:
  contents: write          # 번들 CSV 자동 커밋/푸시용

jobs:
  update-mode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance gspread google-auth pandas

      - name: Run dual sniper mode update
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          DS_ORIGIN_SHEET_URL: ${{ secrets.DS_ORIGIN_SHEET_URL }}
          DS_ORIGIN_TAB: ${{ secrets.DS_ORIGIN_TAB }}
          DS_SHARE_SHEET_URL: ${{ secrets.DS_SHARE_SHEET_URL }}
          DS_SHARE_TAB: ${{ secrets.DS_SHARE_TAB }}
        run: python scripts/dual_sniper_mode_update.py

      # 프리셋 성과 수치(CAGR/MDD/Calmar) 재계산 → preset_stats.json
      # 모드 번들이 갱신된 뒤에 돌려야 듀얼스나이퍼 수치가 최신 모드를 반영한다.
      # 실패해도 모드 번들 커밋은 진행 (기존 수치 파일이 그대로 유지됨).
      - name: Recompute preset performance stats
        continue-on-error: true
        run: python scripts/update_preset_stats.py

      - name: Commit updated bundle CSV + preset stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dual_sniper_modes.csv
          if [ -f preset_stats.json ]; then git add -f preset_stats.json; fi
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 듀얼스나이퍼 모드 번들 · 프리셋 성과 자동 갱신"
            git pull --rebase origin main || true
            git push
          fi
