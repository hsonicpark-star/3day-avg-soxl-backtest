name: Daily LOC Alert (12:00 KST)

# ── 발송 트리거 ──
# 1순위: 외부 cron(cron-job.org)이 매일 03:00 UTC에 workflow_dispatch API 호출
#        → GitHub Actions 내장 cron 큐 지연(평균 4~6h)을 우회, 분 단위 정시 발송
# 2순위(백업): 아래 schedule cron — 외부 서비스 장애 시에도 발송 보장
#        (단 GitHub 큐 사정에 따라 수시간 지연될 수 있음)
# 중복 발송 방지: 스크립트가 '오늘 이미 발송' 가드로 재실행 스킵
on:
  schedule:
    - cron: '0 3 * * 1-5'   # 03:00 UTC = 12:00 KST, 월~금 (백업)
  workflow_dispatch:          # 외부 cron / 수동 실행 진입점
    inputs:
      filter_user:
        description: '특정 username만 실행 (테스트용, 빈 값이면 전체)'
        required: false
        default: ''
      force_run:
        description: '미국 휴장일에도 강제 실행 (1=강제, 빈 값=정상 스킵)'
        required: false
        default: ''
      ds_only:
        description: '듀얼스나이퍼만 발송 (1=DS만, 재발송용)'
        required: false
        default: ''

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance gspread google-auth requests pandas

      - name: Run daily alert script
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ADMIN_SHEET_URL: ${{ secrets.ADMIN_SHEET_URL }}
          FILTER_USER: ${{ github.event.inputs.filter_user }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          DS_ONLY: ${{ github.event.inputs.ds_only }}
        run: python scripts/daily_telegram_alert.py

      - name: Keep Streamlit app awake (절전 방지 ping)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://3day-avg-soxl-backtest.streamlit.app/ || true
