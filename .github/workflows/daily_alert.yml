name: Daily LOC Alert (12:00 KST)

on:
  schedule:
    - cron: '0 3 * * 1-5'   # 03:00 UTC = 12:00 KST, 월~금
  workflow_dispatch:          # 수동 실행 버튼 (테스트용)
    inputs:
      filter_user:
        description: '특정 username만 실행 (테스트용, 빈 값이면 전체)'
        required: false
        default: ''

jobs:
  send-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance gspread google-auth requests pandas

      - name: Run daily alert script
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          ADMIN_SHEET_URL: ${{ secrets.ADMIN_SHEET_URL }}
          FILTER_USER: ${{ github.event.inputs.filter_user }}
        run: python scripts/daily_telegram_alert.py

      - name: Keep Streamlit app awake (절전 방지 ping)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            https://3day-avg-soxl-backtest.streamlit.app/ || true
